name: Python CI

on:
  pull-request:
    branch: [ main ]
  push:
    branch: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/python@v5
        with: 
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Build Code(check compile)
        run: python -m python_compile calc.py

      - name: Run test 
        run: python -m pytest -v 